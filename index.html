<!DOCTYPE html>
<html>
    <head>
        <title>Counter</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="content">
            <h1>Counter</h1>
            <div class="container">
                <span id="number">0</span>
                <div class="menu">
                    <button id="plus">+1</button>
                    <button id="minus">-1</button>
                    <button id="reset">Reset</button>
                </div>
                <div class="stepDiv">
                    <span>Step: </span>
                    <input type="text" id="step" value="1">
                </div>
            </div>
        </div>
    </body>
</html>
